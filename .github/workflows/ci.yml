name: CI

# 只做「不依赖桌面」的检查：单元测试、架构守卫、文案基线。
# UI 冒烟与夜间基线需要真实桌面，留在本地 scripts\ci.ps1 跑。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        shell: pwsh
        run: .\mvnw.cmd -B clean package

      - name: Architecture guard
        shell: pwsh
        run: .\scripts\check-architecture.ps1

      - name: Translation baseline
        shell: pwsh
        run: .\scripts\i18n-report.ps1 -Check -Top 5

      - name: Headless UI smoke
        shell: pwsh
        run: |
          $jar = "target/mc-launcher.jar"
          if (-not (Test-Path $jar)) { throw "找不到 $jar" }
          $out = Join-Path $env:RUNNER_TEMP "smoke.out"
          $err = Join-Path $env:RUNNER_TEMP "smoke.err"
          $process = Start-Process -FilePath "java" `
            -ArgumentList "-Dmc.smoke=1","-jar",$jar `
            -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          if (-not $process.WaitForExit(180000)) {
            $process.Kill()
            Get-Content $out -ErrorAction SilentlyContinue
            throw "无头冒烟超时（180 秒）"
          }
          Get-Content $out -ErrorAction SilentlyContinue
          $log = Get-Content $out -Raw -ErrorAction SilentlyContinue
          if ($log -notmatch "SMOKE DONE ok") {
            Get-Content $err -ErrorAction SilentlyContinue
            throw "无头冒烟失败：没有看到 SMOKE DONE ok"
          }
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mc-launcher-jar
          path: target/mc-launcher.jar
          if-no-files-found: error
          retention-days: 7

  ui-baseline:
    # 像素级视觉基线：需要真实桌面（PrintWindow 截图 + UIA 点击）。
    # runner 上有交互会话时能跑通；跑不通时这一步会失败并留下截图，方便判断是不是环境问题。
    runs-on: windows-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jar
        shell: pwsh
        run: .\mvnw.cmd -B -q package -DskipTests

      - name: Prepare deterministic config
        shell: pwsh
        run: |
          # runner 是全新用户目录：先关掉首启动的性能向导，固定浅色主题，
          # 否则截到的是引导页，和基线（设置页）当然对不上。
          $config = @{
            lightTheme = $true
            performanceAsked = $true
            windowWidth = 1060
            windowHeight = 830
          } | ConvertTo-Json
          Set-Content -Path config.json -Value $config -Encoding utf8
          Get-Content config.json

      - name: Launch app for capture
        shell: pwsh
        run: |
          $jar = "target/mc-launcher.jar"
          $process = Start-Process -FilePath "java" -ArgumentList "-jar", $jar -PassThru
          $process.Id | Out-File -FilePath "$env:RUNNER_TEMP\launcher.pid" -Encoding ascii
          Start-Sleep -Seconds 25
          Get-Process -Id $process.Id | Select-Object Id, MainWindowTitle

      - name: Compare against committed baseline
        shell: pwsh
        run: .\scripts\check-baseline.ps1

      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-baseline-capture
          path: target/baseline-nightly/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop launcher
        if: always()
        shell: pwsh
        run: |
          $pidFile = "$env:RUNNER_TEMP\launcher.pid"
          if (Test-Path $pidFile) {
            $id = Get-Content $pidFile
            Stop-Process -Id $id -Force -ErrorAction SilentlyContinue
          }