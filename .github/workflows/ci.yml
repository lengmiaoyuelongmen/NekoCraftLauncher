name: CI

# 只做「不依赖桌面」的检查：单元测试、架构守卫、文案基线。
# UI 冒烟与夜间基线需要真实桌面，留在本地 scripts\ci.ps1 跑。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        shell: pwsh
        run: .\mvnw.cmd -B clean package

      - name: Architecture guard
        shell: pwsh
        run: .\scripts\check-architecture.ps1

      - name: Translation baseline
        shell: pwsh
        run: .\scripts\i18n-report.ps1 -Check -Top 5

      - name: Headless UI smoke
        shell: pwsh
        run: |
          $jar = "target/mc-launcher.jar"
          if (-not (Test-Path $jar)) { throw "找不到 $jar" }
          $out = Join-Path $env:RUNNER_TEMP "smoke.out"
          $err = Join-Path $env:RUNNER_TEMP "smoke.err"
          $process = Start-Process -FilePath "java" `
            -ArgumentList "-Dmc.smoke=1","-jar",$jar `
            -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          if (-not $process.WaitForExit(180000)) {
            $process.Kill()
            Get-Content $out -ErrorAction SilentlyContinue
            throw "无头冒烟超时（180 秒）"
          }
          Get-Content $out -ErrorAction SilentlyContinue
          $log = Get-Content $out -Raw -ErrorAction SilentlyContinue
          if ($log -notmatch "SMOKE DONE ok") {
            Get-Content $err -ErrorAction SilentlyContinue
            throw "无头冒烟失败：没有看到 SMOKE DONE ok"
          }
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mc-launcher-jar
          path: target/mc-launcher.jar
          if-no-files-found: error
          retention-days: 7
